name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project files
        run: flutter create --platforms=android --project-name mr_chat --org com.mrchat .
      - name: Set app name
        run: sed -i 's/android:label="[^"]*"/android:label="Mr Chat"/' android/app/src/main/AndroidManifest.xml
      - name: Add microphone permission
        run: sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Set minSdk 23 for Firebase
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' android/app/build.gradle || true
      - name: Install fixed signing key
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey
      - run: flutter pub get
      - name: Build release APK
        run: |
          flutter build apk --release 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo ""
            echo "=========== ERROR SUMMARY ==========="
            grep -n -E "^e: |error:|Error:|What went wrong|Caused by|Could not|Execution failed|Unresolved|incompatible|requires" build.log | tail -40
            echo "=========== LAST 40 LINES ==========="
            tail -40 build.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mr-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
